<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/styles.css" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=  , initial-scale=1.0" />
    <title>LINE CALL</title>
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>18:30</span>
      </div>
      <div class="status-bar__column">
        <i class="fas fa-signal fa-lg"></i>
        <i class="fas fa-wifi fa-lg"></i>
        <i class="fas fa-battery-full fa-lg"></i>
      </div>
    </div>
    <header class="call-header">
      <div class="vcallheader__column">
        <h1>通話</h1>
      </div>
      <div class="call-header__column">
        <i class="far fa-user-circle"></i>
      </div>
    </header>
    <main class="main-screen">
      <div class="user-component">
        <div class="user-component__column">
          <div class="user-component__image">
            <img
              src="https://www.linefriends.jp/img/ic-bf-choco.b4d6485a.png"
            />
            <i class="fab fa-line fa-lg badge__line"></i>
          </div>
          <div class="user-component__contents">
            <h4 class="user_component__red">チョコ<span>&nbsp;</span></h4>
            <h5><i class="fas fa-reply"></i>&nbsp;2022/01/07</h5>
          </div>
        </div>
        <div class="user-component__column">
          <i></i>
          <i class="fas fa-phone-alt"></i>
        </div>
      </div>
      <div class="user-component">
        <div class="user-component__column">
          <div class="user-component__image">
            <img src="https://www.linefriends.jp/img/ic-bf-moon.d883cd86.png" />
            <i class="fab fa-line fa-lg badge__line"></i>
          </div>
          <div class="user-component__contents">
            <h4 class="user_component__red">ムーン<span>&nbsp;(3)</span></h4>
            <h5><i class="fas fa-reply"></i>&nbsp;2022/01/05</h5>
          </div>
        </div>
        <div class="user-component__column">
          <i></i>
          <i class="fas fa-phone-alt"></i>
        </div>
      </div>
      <div class="user-component">
        <div class="user-component__column">
          <div class="user-component__image">
            <img
              src="https://www.linefriends.jp/img/ic-bf-leonard.0a5ab619.png"
            />
            <i class="fab fa-line fa-lg badge__line"></i>
          </div>
          <div class="user-component__contents">
            <h4>レナード<span>&nbsp;</span></h4>
            <h5><i class="fas fa-share"></i>&nbsp;2022/01/01</h5>
          </div>
        </div>
        <div class="user-component__column">
          <i></i>
          <i class="fas fa-phone-alt"></i>
        </div>
      </div>
    </main>

    <nav class="nav">
      <div class="nav-list">
        <div class="nav-list__column">
          <a href="friends.html">
            <i class="far fa-user fa-2x"></i>
          </a>
          <span>ホーム</span>
        </div>
        <div class="nav-list__column">
          <a href="talks.html">
            <i class="far fa-comment-dots fa-2x"></i>
          </a>
          <span>トーク</span>
        </div>
        <div class="nav-list__column">
          <a href="voom.html">
            <i class="far fa-play-circle fa-2x"></i>
          </a>
          <span>VOOM</span>
        </div>
        <div class="nav-list__column">
          <a href="call.html">
            <i class="fas fa-mobile fa-2x"></i>
          </a>
          <span>通話</span>
        </div>
      </div>
    </nav>
    <div id="no-mobile">
      <span>Your screen is to big T_T</span>
    </div>
    <script
      src="https://kit.fontawesome.com/620d065625.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
